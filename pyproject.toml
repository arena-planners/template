[project]
name = "arena_planners_template"
version = "0.0.0"
description = "Template planner for the arena_planners bridge."
requires-python = ">=3.10"
dependencies = [
    "arena_planners",
    "numpy",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.uv.sources]
arena_planners = { git = "https://github.com/arena-planners/arena_planners.git", branch = "jazzy", subdirectory = "arena_planners" }

[tool.setuptools]
packages = []
py-modules = []

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.pyright]
pythonVersion = "3.10"
pythonPlatform = "Linux"
typeCheckingMode = "standard"
